<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유지케어 병원 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: left sidebar menu + one work area per screen. Tokens follow the 유지케어 patient app. */
:root{
  --ground:#F4F4F2;--surface:#FFFFFF;--ink:#1A1A1A;--muted:#5C5C58;--faint:#9A9A95;--line:#D6D6D2;--div:#E6E6E2;
  --accent:#2F5BD3;--accent-dark:#1E3F9E;--accent-tint:#E9EEFB;--band:#9AAEE6;--on-accent:#FFFFFF;
  --warn:#B4500B;--warn-tint:#FDF1E7;--warn-line:#F2C9A6;--warn-dark:#8A3D08;--warn-bar:#E59A62;
  --danger:#B42318;--danger-tint:#FDECEA;--danger-line:#F4C1BC;--neutral-tint:#EDEDEA;--bar:#C9C9C4;
  --inverse:#1A1A1A;--inverse-fg:#FFFFFF;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#121211;--surface:#1C1C1A;--ink:#EDEDEA;--muted:#A9A9A3;--faint:#7A7A73;--line:#3A3A36;--div:#2B2B28;
  --accent:#6F8FF0;--accent-dark:#AFC0F7;--accent-tint:#1E2846;--band:#3D4F8C;--on-accent:#0E1430;
  --warn:#EE9F68;--warn-tint:#33231A;--warn-line:#6A4126;--warn-dark:#F5C9A6;--warn-bar:#C77A45;
  --danger:#F2867B;--danger-tint:#3A1C19;--danger-line:#6E302A;--neutral-tint:#2A2A27;--bar:#55554F;
  --inverse:#2A2A27;--inverse-fg:#F4F4F2;color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#121211;--surface:#1C1C1A;--ink:#EDEDEA;--muted:#A9A9A3;--faint:#7A7A73;--line:#3A3A36;--div:#2B2B28;
  --accent:#6F8FF0;--accent-dark:#AFC0F7;--accent-tint:#1E2846;--band:#3D4F8C;--on-accent:#0E1430;
  --warn:#EE9F68;--warn-tint:#33231A;--warn-line:#6A4126;--warn-dark:#F5C9A6;--warn-bar:#C77A45;
  --danger:#F2867B;--danger-tint:#3A1C19;--danger-line:#6E302A;--neutral-tint:#2A2A27;--bar:#55554F;
  --inverse:#2A2A27;--inverse-fg:#F4F4F2;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:400 14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{margin:0;font-size:22px;line-height:1.3;font-weight:700;text-wrap:balance}
h2{margin:0;font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}.s13{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* sidebar */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--div);padding:24px 14px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;flex:none}
.brand b{font-size:15px;display:block}.brand small{color:var(--muted);font-size:12px}
.snav{display:flex;flex-direction:column;gap:4px}
.snav button{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border:0;border-radius:12px;background:none;font-weight:500;cursor:pointer;text-align:left;white-space:nowrap}
.snav svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.snav button:hover{background:var(--ground)}
.snav button[aria-current="page"]{background:var(--accent-tint);color:var(--accent-dark);font-weight:600}
.snav button[aria-current="page"] svg{stroke:var(--accent)}
.snav .cnt{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.coach{margin-top:auto;background:var(--inverse);color:var(--inverse-fg);border-radius:16px;padding:14px;display:grid;gap:2px}
.coach small{opacity:.7;font-size:12px}.coach b{font-size:15px}
.me{display:flex;gap:10px;align-items:center;font-size:13px;padding:0 10px}
.avatar{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--faint);flex:none}
.me small{display:block;color:var(--muted);font-size:12px}

main{padding:28px 32px 48px;display:flex;flex-direction:column;gap:16px;min-width:0;max-width:1240px}
.head p{margin-top:4px;color:var(--muted);font-size:13px}

.card{background:var(--surface);border:1px solid var(--div);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.wide{flex:1}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.danger{background:var(--danger-tint);color:var(--danger)}
.chip.warn{background:var(--warn-tint);color:var(--warn)}
.chip.ok{background:var(--neutral-tint);color:var(--muted)}
.chip.info{background:var(--accent-tint);color:var(--accent-dark)}
.badge{background:var(--warn-tint);color:var(--warn);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}

/* patients */
.md{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.plist{padding:8px;gap:2px}
.plist .h{display:flex;justify-content:space-between;padding:8px 10px 6px;font-size:12px;color:var(--faint);font-weight:600}
.pr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:12px;border-radius:12px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.pr:hover{background:var(--ground)}
.pr[aria-current="true"]{background:var(--accent-tint)}
.pr b{font-weight:600}
.pr .r{grid-column:1/-1;font-size:12px;color:var(--muted)}
.pr .r.danger{color:var(--danger)}.pr .r.warn{color:var(--warn)}.pr .r.info{color:var(--accent-dark);font-weight:600}
.sep{height:1px;background:var(--div);margin:6px 10px}
.more{border:0;background:none;color:var(--muted);font-size:12px;padding:8px 12px;text-align:left;cursor:pointer}
.say{background:var(--ground);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.say small{color:var(--faint);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ck{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ck>small{font-size:12px;color:var(--faint);font-weight:600;margin-right:2px}
.chip.faint{background:none;border:1px dashed var(--line);color:var(--faint)}
.script{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px;line-height:1.5}
.plan{display:flex;align-items:baseline;gap:6px}.plan b{font-size:26px}
.tile{border:1px solid var(--div);border-radius:14px;padding:12px 14px;display:grid;gap:2px;align-content:start}
.tile.bad{border-color:var(--danger-line);background:var(--danger-tint)}
.tile.mid{border-color:var(--warn-line);background:var(--warn-tint)}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;font-weight:500;color:var(--muted)}
.tile .s{font-size:12px;color:var(--muted)}
.tile.bad .s{color:var(--danger)}.tile.mid .s{color:var(--warn-dark)}
.tile svg{width:100%;height:30px;margin-top:6px;display:block}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.status{display:grid;gap:2px;background:var(--accent-tint);color:var(--accent-dark);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600}
.status span{font-weight:400;color:var(--muted)}
.sheet{border:1px solid var(--accent);border-radius:14px;padding:16px;display:grid;gap:14px}
.taggrid{display:flex;flex-wrap:wrap;gap:8px}
.tag{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;white-space:nowrap}
.tag:hover{border-color:var(--faint)}
.tag[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-dark);font-weight:600}
.slotgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slotgrid .tag{border-radius:12px;height:auto;min-height:48px;padding:6px 10px;line-height:1.35;white-space:normal}
.preview{background:var(--ground);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.preview>small{font-size:12px;color:var(--faint);font-weight:600}
.preview ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.preview li{display:flex;gap:8px;font-size:13px}
.preview li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;margin-top:8px}
details.raw summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
.bubbles{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bb{max-width:80%;padding:9px 12px;font-size:13px;line-height:1.5;border-radius:14px 14px 14px 4px;background:var(--ground);align-self:flex-start}
.bb.me{align-self:flex-end;background:var(--accent-tint);border-radius:14px 14px 4px 14px}

/* tables */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--div);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:680px}
th{font-size:12px;font-weight:500;color:var(--faint);text-align:left;padding:12px 16px;border-bottom:1px solid var(--div);white-space:nowrap}
td{padding:13px 16px;border-top:1px solid var(--div);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
tbody tr:first-child td{border-top:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--ground)}
tbody tr[aria-selected="true"] td{background:var(--accent-tint)}
td b{font-weight:600;font-size:14px}
td.w{color:var(--warn)}td.d{color:var(--danger)}td.f{color:var(--faint)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--div);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}

/* schedule */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--div);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day>b{font-size:13px}.day>b span{color:var(--faint);font-weight:500}
.ap{border-radius:10px;padding:8px 10px;font-size:12px;background:var(--ground);display:grid;gap:1px}
.ap b{font-size:13px}
.ap.req{background:var(--accent-tint);color:var(--accent-dark)}
.ap.ask{border:1px dashed var(--accent);background:none;color:var(--accent-dark)}
.ap.open{border:1px dashed var(--line);background:none;color:var(--faint)}

/* settings */
.set{display:grid;gap:0}
.set>div{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--div);flex-wrap:wrap}
.set>div:first-child{border-top:0;padding-top:0}
.set b{display:block;font-weight:600}.set span.d{font-size:12px;color:var(--muted)}
.tog{position:relative;width:44px;height:26px;flex:none}
.tog input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.tog i{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .15s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.tog input:checked+i{background:var(--accent)}
.tog input:checked+i::after{transform:translateX(18px)}
.tog input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}

/* invite / stats */
.qr{width:120px;height:120px;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(12,1fr);background:#fff;flex:none}
.qr i{background:#1A1A1A}.qr i.o{background:none}
.copy{display:flex;justify-content:space-between;align-items:center;background:var(--ground);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:500}
.list>div{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--div);font-size:13px;gap:12px}
.list>div:first-child{border-top:0}
.big4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.big4>div{background:var(--surface);border:1px solid var(--div);border-radius:14px;padding:16px;display:grid;gap:2px}
.big4 b{font-size:24px;font-variant-numeric:tabular-nums}
.big4 span{font-size:12px;color:var(--muted)}
.cmp{display:grid;gap:6px}
.cmp .t{display:flex;align-items:center;gap:10px}
.cmp .t>div{flex:1;height:10px;border-radius:5px;background:var(--ground);overflow:hidden}
.cmp .t>div i{display:block;height:100%;border-radius:5px}
.cmp .t b{width:36px;text-align:right;font-size:13px}
.bars{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;height:180px;padding:0 8px}
.bars>div{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.bars i{width:min(40px,100%);border-radius:8px 8px 0 0;background:var(--band)}
.bars .last i{background:var(--accent)}
.bars b{font-size:12px;color:var(--muted)}.bars span{font-size:12px;color:var(--faint)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--inverse);color:var(--inverse-fg);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px)}

.applink{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--div);border-radius:10px;padding:8px 10px}
.applink:hover{border-color:var(--accent);color:var(--accent)}
.applink .dot{width:8px;height:8px;border-radius:4px;background:var(--faint);flex:none}
.applink.on{color:var(--accent-dark);border-color:var(--accent-tint);background:var(--accent-tint)}
.applink.on .dot{background:var(--accent)}
@media (max-width:1180px){.split{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.week{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 16px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--div)}
  .snav{flex-direction:row}.coach,.me,.brand small{display:none}
  main{padding:20px 16px 40px}
  .md,.two{grid-template-columns:minmax(0,1fr)}.big4{grid-template-columns:repeat(2,minmax(0,1fr))}.slotgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.week{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){.tiles{grid-template-columns:minmax(0,1fr)}.actions .btn{flex:1 1 100%}.week{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 진료실 차트 */
.chart{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.chart .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.pre{display:grid;gap:2px;background:var(--accent-tint);color:var(--accent-dark);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600}
.pre span{font-weight:400;color:var(--muted)}
.pre.warn{background:var(--warn-tint);color:var(--warn-dark)}
.checks{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.checks li{display:flex;gap:8px;align-items:baseline;font-size:13px;line-height:1.5}
.bk{flex:none;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--warn-tint);color:var(--warn)}
.bk.q{background:var(--accent-tint);color:var(--accent-dark)}
.tl{display:grid;gap:0}
.tl>div{display:grid;grid-template-columns:78px 72px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--div);font-size:12px;line-height:1.45;align-items:baseline}
.tl>div:first-child{border-top:0;padding-top:0}
.tl .d{color:var(--faint);font-variant-numeric:tabular-nums}
.tl .k{font-weight:600;justify-self:start;border-radius:6px;padding:0 6px}
.tl .k.auto{background:var(--neutral-tint);color:var(--muted)}
.tl .k.info{background:var(--accent-tint);color:var(--accent-dark)}
.tl .t{font-size:13px}
.draft{display:grid;gap:6px;background:var(--ground);border-radius:12px;padding:10px 12px;min-height:44px;align-content:center}
.draft>div{display:flex;gap:8px;align-items:baseline;font-size:13px}
.draft>div>span:not(.dk){flex:1}
.dk{flex:none;font-size:11px;font-weight:600;color:var(--accent-dark)}
.x{border:0;background:none;color:var(--faint);font-size:16px;line-height:1;cursor:pointer;padding:0 4px}
.x:hover{color:var(--danger)}
.inp{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);font-size:13px}
.phr{display:grid}
.phr>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--div)}
.phr>div:first-child{border-top:0;padding-top:0}
.phr b{display:block;font-weight:600;font-size:13px}.phr .d{font-size:12px;color:var(--muted)}
.inbox{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.inbox .pr{grid-template-columns:1fr auto}
@media (max-width:1180px){.chart,.inbox{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">유</div><div><b>유지케어</b><small>[병원 이름] 의원 · 비만 클리닉</small></div></div>
  <nav class="snav" id="nav" aria-label="병원 메뉴"></nav>
  <a class="applink" id="applink" href="../app/#/home" target="keepfit-patient"><span class="dot"></span><span id="applinkText">환자 앱 열기</span></a>
  <div class="coach"><small>오늘 진료 · 10월 3일 (토)</small><b>예약 4명</b><small>진료 전 앱 기록 3명 · 체중 측정 생략 3명</small></div>
  <div class="me"><div class="avatar"></div><div><b>[원장 이름] 원장</b><small>관리자</small></div></div>
</aside>
<main id="main"></main>
</div>

<script>
/* ===== 상용구: 처방·답변·조언·다음 예약에 반복해서 쓰는 문구. 누르면 차트·답변에 자동 입력 ===== */
const PHRASES={

function bars(vals){const W=200,H=30,n=vals.length,bw=14,step=W/n;let g=`<line x1="0" x2="${W}" y1="${H-.8*H}" y2="${H-.8*H}" style="stroke:var(--warn);stroke-dasharray:3 3;stroke-width:1"/>`;
 vals.forEach((v,i)=>{const h=v/10*H;g+=`<rect x="${step*i+step/2-bw/2}" y="${H-h}" width="${bw}" height="${h}" rx="3" style="fill:${v>=8?'var(--warn-bar)':'var(--bar)'}"/>`;});

 if(r.symptoms.some(x=>x!=='없음'))o.push(`불편한 증상: ${r.symptoms.join(', ')} · 용량·처방 확인`);
 if(S.cfg.sos&&r.sos>=5)o.push(`식욕 SOS 이번 주 ${r.sos}회 · 넘김 ${r.sosRes}회`);
 if(S.cfg.miss&&!r.ok)o.push(`앱 기록 2일 없음 · 도착 후 체중 측정 필요`);
 if(p.ck)o.push(`${p.ck} 시기`);
 return o;}

 return `

 </div>`;}

 <div class="head"><div class="row"><h1>진료 효율</h1><span class="badge">예시 데이터</span></div><p>2026년 9월 · 도입 전(6월)과 비교</p></div>
 <div class="big4"><div><span>진료 1건당 문진·체중 측정</span><b>2분</b><span>도입 전 7분</span></div><div><span>진료 전 앱 기록률</span><b>86%</b><span>예약 환자 중</span></div><div><span>전화 문의</span><b>−62%</b><span>앱 문의로 옮겨 옴</span></div><div><span>차트 작성 시간</span><b>40초</b><span>상용구 사용 74%</span></div></div>
 <div class="two">
  <div class="card"><div class="between"><h2>같은 진료 시간에 볼 수 있는 환자</h2><span class="muted s13">하루 평균</span></div>
   <div class="bars" role="img" aria-label="도입 전 28명, 도입 후 34명">${[['도입 전',28],['도입 후',34]].map(([m,v],i)=>`<div class="${i?'last':''}"><b>${v}명</b><i style="height:${v*4.5}px"></i><span>${m}</span></div>`).join('')}</div>

   <div class="list"><div><span>앱으로 받은 질문</span><b>63건</b></div><div><span>상용구로 답한 질문</span><b>48건 (76%)</b></div><div><span>평균 답변 시간</span><b>3시간</b></div><div><span>위험 신호로 앞당긴 내원</span><b>5건</b></div><div><span>단약 후 체중 유지율 (6개월)</span><b>83% · 비참여 41%</b></div></div></div>

const tog=(id,on,label)=>`<label class="tog"><input type="checkbox" data-cfg="${id}" aria-label="${label}" ${on?'checked':''}><i></i></label>`;
function vSettings(){const c=S.cfg,k=S.setCat;return `
 <div class="head"><h1>설정</h1><p>상용구, 환자 앱 기록 항목, 알림 기준을 병원에 맞게 바꿔요</p></div>
 <div class="two">
  <div class="col">
   <div class="card"><div class="between"><h2>상용구</h2><span class="faint small">켠 것만 차트·문의함에 보여요</span></div>
    <div class="seg">${CATS.map(x=>`<button aria-pressed="${k===x}" data-scat="${x}">${PHRASES[x].label} ${PHRASES[x].items.length}</button>`).join('')}</div>
    <div class="phr">${PHRASES[k].items.map(([l,t])=>`<div><div><b>${esc(l)}</b><span class="d">${esc(t)}</span></div>${tog('ph:'+k+':'+l,!c.off[k+':'+l],l)}</div>`).join('')}</div>
    <form class="row" data-form="phrase" style="flex-wrap:nowrap"><input class="inp" name="phrase" placeholder="새 ${PHRASES[k].label} 상용구 (예: 위고비 1.0mg 유지)" autocomplete="off"><button class="btn sm">추가</button></form>
    <p class="faint small">${PHRASES[k].app?'이 분류는 환자 앱에도 보낼 수 있어요':'처방은 차트에만 남고 환자 앱에는 가지 않아요'}</p></div>
   <div class="card"><h2>환자 앱 기록 항목</h2>
    <div class="set">${[['weight','체중','아침 공복 · 진료 날엔 병원 측정 대신'],['appetite','식욕 (1–10)','매일'],['stress','스트레스 (1–10)','매일'],['sleep','수면 시간','매일'],['symptoms','불편한 증상','메스꺼움·변비·속쓰림·어지러움·피로']].map(([id,l,d])=>`<div><div><b>${l}</b><span class="d">${d}</span></div>${tog('rec:'+id,c.rec[id],l)}</div>`).join('')}
     <div><div><b>앱 기록을 2일 놓치면 AI 전화로 대신 묻기</b><span class="d">놓친 환자에게만 걸어요</span></div>${tog('callFallback',c.callFallback,'AI 전화 대체')}</div></div></div>
   <div class="card"><h2>차트에 "확인할 것"으로 올리는 기준</h2>
    <div class="set">
     <div><div><b>체중이 유지 범위를 벗어나면</b><span class="d">목표 체중 ±2kg</span></div>${tog('weight',c.weight,'체중')}</div>
     <div><div><b>식욕 7일 평균 8 이상</b><span class="d">주의로 표시</span></div>${tog('appetite',c.appetite,'식욕')}</div>
     <div><div><b>스트레스 7일 평균 7 이상</b><span class="d">식욕과 함께 보여줘요</span></div>${tog('stress',c.stress,'스트레스')}</div>
     <div><div><b>식욕 SOS 한 주 5회 이상</b><span class="d">시간대·이유와 함께</span></div>${tog('sos',c.sos,'식욕 SOS')}</div>
     <div><div><b>앱 기록 2일 없음</b><span class="d">진료 날이면 도착 후 체중 측정 안내</span></div>${tog('miss',c.miss,'미기록')}</div>
    </div></div>
  </div>
  <div class="col">
   <div class="card"><div class="between"><h2>이용 요금</h2>${chip('info','파일럿')}</div>
    <div class="plan"><b>월 10만원</b><span class="muted s13">의원 1곳</span></div>
    <p class="muted s13">환자는 무료로 써요. 약값·진료비는 지금처럼 병원에서 받으시면 돼요.</p></div>
   <div class="card"><div class="between"><h2>연동 로드맵</h2><span class="faint small">병원이 이미 쓰는 시스템과 하나로</span></div>
    <div class="list">${[['예약·접수','오늘 진료 순서와 빈 시간을 자동으로','준비 중','warn'],['전자의무기록(EMR) 차트','앱 기록·질문·상용구 기록이 기존 차트에 바로','예정','faint'],['처방 시스템','처방 상용구를 처방전으로 바로','예정','faint'],['서류 템플릿','소견서·진료확인서를 기록으로 자동 채우기','예정','faint']].map(([n,d,s,k])=>`<div><span><b>${n}</b><br><span class="faint small">${d}</span></span>${chip(k,s)}</div>`).join('')}</div></div>
   <div class="card"><div class="between"><h2>진료 시간</h2><span class="faint small">30분 단위 예약</span></div>
    <div class="set"><div><b>평일</b><span class="s13">오전 10:00–12:30 · 오후 2:00–5:30</span></div><div><b>화·목 저녁</b><span class="s13">오후 6:00–8:30</span></div><div><b>토요일</b><span class="s13">오전 9:30–1:00</span></div></div></div>
   <div class="card"><div class="between"><div><h2>데모 초기화</h2><p class="muted s13" style="margin-top:4px">차트 기록·답변·내원 요청·예약을 지우고 처음 상태로 돌려요. 환자 앱의 질문·알림도 함께 사라져요.</p></div><button class="btn sm" data-act="demo-reset">초기화</button></div></div>
  </div>
 </div>`;}

/* ===== render + events ===== */
const NAV=[['clinic','진료실'],['inbox','문의함'],['schedule','내원 일정'],['invite','환자 초대'],['stats','진료 효율'],['settings','설정']];
const NICON={clinic:'<rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M9 3.5v3h6v-3M8 11h8M8 15h5"/>',
 inbox:'<path d="M3.5 13.5 6 5h12l2.5 8.5V19a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/><path d="M3.5 13.5H9a3 3 0 0 0 6 0h5.5"/>',
 schedule:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 invite:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>',
 stats:'<path d="M4 20h16M7 17v-7M12 17V5M17 17v-5"/>',
 settings:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'};
const V={clinic:vClinic,inbox:vInbox,schedule:vSchedule,invite:vInvite,stats:vStats,settings:vSettings};
function render(){const nc=needCount(),wq=waiting().filter(q=>q.kind==='ask').length;
 document.getElementById('nav').innerHTML=NAV.map(([k,l])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24">${NICON[k]}</svg>${l}${k==='clinic'&&nc?`<span class="cnt">${nc}</span>`:k==='inbox'&&wq?`<span class="cnt">${wq}</span>`:''}</button>`).join('');
 document.getElementById('main').innerHTML=V[S.tab]();
}
function bookLater(id){setTimeout(()=>{if(!S.visit[id]||S.booked[id])return;S.booked[id]=S.offered[id][0];if(id==='jieun'){writeLink({booking:{slot:S.booked[id],at:Date.now()}});lastLink=readLink();}render();toast(`${P(id).name}님이 ${slot1(S.booked[id])}로 예약했어요`);},6000);}
function nowLabel(){return '오늘 '+hhmm(Date.now());}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab],[data-sel],[data-act],[data-goto],[data-vwin],[data-vband],[data-cat],[data-ph],[data-rm],[data-inf],[data-inq],[data-rcat],[data-rph],[data-rrm],[data-scat]');if(!t)return;
 const d=t.dataset;
 if(d.tab){S.tab=d.tab;render();window.scrollTo(0,0);return;}
 if(d.sel){S.sel=d.sel;S.vsheet=false;S.draft=[];S.free='';render();return;}
 if(d.goto){S.tab='clinic';S.sel=d.goto;S.vsheet=false;render();window.scrollTo(0,0);return;}
 if(d.vwin){S.vwin=d.vwin;render();return;}
 if(d.vband){const b=d.vband;S.vbands=S.vbands.includes(b)?S.vbands.filter(x=>x!==b):[...S.vbands,b];render();return;}
 if(d.cat){S.cat=d.cat;render();return;}
 if(d.ph){const txt=textOf(S.cat,d.ph),i=S.draft.findIndex(([k,x])=>k===S.cat&&x===txt);if(i>=0)S.draft.splice(i,1);else S.draft.push([S.cat,txt]);render();return;}
 if(d.rm){S.draft.splice(+d.rm,1);render();return;}
 if(d.inf){S.inboxF=d.inf;S.inboxSel=null;S.rdraft=[];render();return;}
 if(d.inq){S.inboxSel=d.inq;S.rdraft=[];S.rfree='';render();return;}
 if(d.rcat){S.rcat=d.rcat;render();return;}
 if(d.rph){const txt=textOf(S.rcat,d.rph),i=S.rdraft.indexOf(txt);if(i>=0)S.rdraft.splice(i,1);else S.rdraft.push(txt);render();return;}
 if(d.rrm){S.rdraft.splice(+d.rrm,1);render();return;}
 if(d.scat){S.setCat=d.scat;render();return;}
 const a=d.act,p=P(S.sel);
 if(a==='vsheet'){S.vsheet=true;S.vwin='week';S.vbands=['am','pm','eve'];render();}
 else if(a==='vsheet-close'){S.vsheet=false;render();}
 else if(a==='visit'){S.offered[p.id]=pickSlots(S.vwin,S.vbands).map(o=>o.label);S.visit[p.id]=true;S.vsheet=false;
  const ch=checks(p);if(p.id==='jieun'){writeLink({visitRequest:{slots:S.offered[p.id],message:msgFor(S.vwin,p),signals:ch.slice(0,2).join(' · ')||undefined,at:Date.now()},booking:null});lastLink=readLink();}
  (S.charts[p.id]=S.charts[p.id]||[]).push({t:nowLabel(),ts:Date.now(),lines:[['next',`내원 요청 · 가능한 시간 ${S.offered[p.id].length}개 보냄`]]});
  render();toast(`${p.name}님 앱으로 내원 요청과 가능한 시간 ${S.offered[p.id].length}개를 보냈어요`);if(p.id!=='jieun'||!patientAlive())bookLater(p.id);}
 else if(a==='call-now'){if(!patientAlive()){toast('환자 앱이 열려 있지 않아요. 같은 브라우저에서 환자 앱을 먼저 열어 주세요');return;}writeLink({callRequest:{at:Date.now()}});lastLink=readLink();toast('지은님 휴대폰으로 AI 코치 전화를 걸었어요');}
 else if(a==='due'){const q=P(d.id);S.offered[q.id]=pickSlots('2w',['am','pm','eve']).map(o=>o.label);S.visit[q.id]=true;render();toast(`${q.name}님 앱으로 ${q.ck} 요청을 보냈어요`);bookLater(q.id);}
 else if(a==='save'){const lines=S.draft.slice(),appLines=lines.filter(([k])=>k==='free'||PHRASES[k].app).map(([,x])=>x);
  (S.charts[p.id]=S.charts[p.id]||[]).push({t:nowLabel(),ts:Date.now(),lines});
  const send=S.sendApp&&appLines.length;
  if(send&&p.id==='jieun'){const L=readLink();writeLink({memos:[...(L.memos||[]),{lines:appLines,tags:lines.map(([,x])=>x),at:Date.now()}]});lastLink=readLink();}
  S.draft=[];S.free='';render();toast(send?`차트에 저장하고 ${p.name}님 앱에 ${appLines.length}줄을 보냈어요`:'차트에 저장했어요');}
 else if(a==='reply'){const q=allQs().find(x=>x.id===d.q),lines=S.rdraft.slice(),at=Date.now();if(!q)return;
  if(q.live){const L=readLink();writeLink({inquiries:(L.inquiries||[]).map(x=>x.id===q.id?{...x,reply:{lines,tags:lines,at}}:x)});lastLink=readLink();applyPatient();}
  else S.replies[q.id]={lines,at:'방금'};
  (S.charts[q.pid]=S.charts[q.pid]||[]).push({t:nowLabel(),ts:at,lines:lines.map(x=>['answer',x])});
  S.rdraft=[];S.rfree='';render();toast(`${q.name}님 앱으로 답변을 보냈어요 · 차트에도 남겼어요`);}
 else if(a==='demo-reset'){const L=readLink();try{localStorage.setItem(LINK_KEY,JSON.stringify(L.patient?{patient:L.patient}:{}))}catch(err){}lastLink=readLink();S=init();S.tab='settings';applyPatient();render();toast('처음 상태로 돌렸어요');}
 else if(a==='toast')toast(d.msg);
 else if(a==='copy'){const txt='yujicare.kr/c/[병원코드]';try{navigator.clipboard.writeText(txt).then(()=>toast('링크를 복사했어요'),()=>toast(txt));}catch(err){toast(txt);}}
});
document.addEventListener('submit',e=>{const f=e.target.dataset&&e.target.dataset.form;if(!f)return;e.preventDefault();const v=(e.target.elements[f].value||'').trim();if(!v)return;
 if(f==='free'){S.draft.push(['free',v]);S.free='';}
 else if(f==='rfree'){S.rdraft.push(v);S.rfree='';}
 else if(f==='phrase'){PHRASES[S.setCat].items.push([v.length>14?v.slice(0,14)+'…':v,v]);toast(`${PHRASES[S.setCat].label} 상용구를 추가했어요`);}
 render();const el=document.querySelector(`[data-form="${f}"] input`);if(el)el.focus();});
document.addEventListener('input',e=>{const n=e.target.name;if(n==='free')S.free=e.target.value;else if(n==='rfree')S.rfree=e.target.value;});
document.addEventListener('change',e=>{const ds=e.target.dataset||{};
 if('send' in ds){S.sendApp=e.target.checked;render();return;}
 const k=ds.cfg;if(!k)return;
 if(k.startsWith('ph:')){const key=k.slice(3);if(e.target.checked)delete S.cfg.off[key];else S.cfg.off[key]=true;return;}
 if(k.startsWith('rec:')){S.cfg.rec[k.slice(4)]=e.target.checked;toast(e.target.checked?'환자 앱 기록 항목에 넣었어요':'환자 앱 기록 항목에서 뺐어요');return;}
 S.cfg[k]=e.target.checked;toast(e.target.checked?'켰어요':'껐어요');});
applyPatient();render();paintAlive();setInterval(paintAlive,2000);
</script>
